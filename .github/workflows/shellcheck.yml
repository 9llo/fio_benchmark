name: Shell Lint

on:
  push:
    branches: ["main", "develop"]
    paths:
      - "**.sh"
      - ".github/workflows/shellcheck.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "**.sh"
      - ".github/workflows/shellcheck.yml"

permissions:
  contents: read

jobs:
  shellcheck:
    name: ShellCheck (${{ matrix.shell }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        shell: [bash]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: "."
          severity: warning
          check_together: true
          additional_files: "fio_benchmark.sh"
        env:
          # Enable all optional checks for maximum coverage
          SHELLCHECK_OPTS: >-
            --enable=all
            --shell=bash
            --external-sources

  shfmt:
    name: shfmt format check
    runs-on: ubuntu-latest
    # Style is advisory — ShellCheck and bash-version are the hard gates
    continue-on-error: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install shfmt
        run: |
          SHFMT_VERSION="3.8.0"
          curl -fsSL "https://github.com/mvdan/sh/releases/download/v${SHFMT_VERSION}/shfmt_v${SHFMT_VERSION}_linux_amd64" \
            -o /usr/local/bin/shfmt
          chmod +x /usr/local/bin/shfmt
          shfmt --version

      - name: Auto-format with shfmt then diff
        # Write changes in-place, then use git diff to surface a clean patch.
        # Exit code comes from git diff --exit-code (0 = clean, 1 = dirty).
        run: |
          shfmt -i 2 -ci -bn -sr -w fio_benchmark.sh
          echo "--- shfmt diff (empty = already clean) ---"
          git diff --exit-code fio_benchmark.sh || {
            echo "::warning file=fio_benchmark.sh::shfmt found formatting differences (shown above)"
            exit 1
          }

  bash-version:
    name: Syntax check (Bash ${{ matrix.bash-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        bash-version: ["4.4", "5.0", "5.1", "5.2"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Pull Bash ${{ matrix.bash-version }} image
        run: docker pull bash:${{ matrix.bash-version }}

      - name: Syntax check in Bash ${{ matrix.bash-version }}
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/work" \
            bash:${{ matrix.bash-version }} \
            bash -n /work/fio_benchmark.sh && \
            echo "Syntax OK for Bash ${{ matrix.bash-version }}"
